<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Plugin · design canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #fafafa; font-family: 'DM Sans', system-ui, sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@1.14.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="starters/ios-frame.jsx"></script>
<script type="text/babel" src="starters/tablet-frame.jsx"></script>
<script type="text/babel" src="starters/design-canvas.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel" data-presets="react">
const W = window;

// The two device targets: iPad Pro 11" (M4) portrait on the counter,
// iPhone 14/15-class phone in the manager's hand. Sizes are the SCREEN;
// the frames add their own bezel, hence the artboard padding.
const PHONE_W = 390, PHONE_H = 844;
const TABLET_W = 834, TABLET_H = 1194;
const PAD = 40;          // phone frame is flush — just breathing room
const TABLET_PAD = 100;  // tablet bezel + rim (~30 per side) + breathing room

function Phone({ children, height }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100%' }}>
      <W.IOSDevice width={PHONE_W} height={height || PHONE_H}>{children}</W.IOSDevice>
    </div>
  );
}

function Tablet({ children, width, height }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100%' }}>
      <W.TabletDevice width={width || TABLET_W} height={height || TABLET_H}>{children}</W.TabletDevice>
    </div>
  );
}

function App() {
  return (
    <W.DesignCanvas minScale={0.1} maxScale={3}>
      <W.DCSection id="pos" title="POS · tablet"
        subtitle="Live menu — name, price, category, availability. Tapping items builds an order with a running total. The first artboard is live: tap the menu, use the steppers, and from 8s on the manager's edits land one at a time — sold out, a new price, a change in a category you are not looking at, an item leaving the menu mid-order, and a new item arriving.">
        <W.DCArtboard id="pos-order" label="POS · menu & order — INTERACTIVE" width={TABLET_W + TABLET_PAD} height={TABLET_H + TABLET_PAD}>
          <Tablet><W.POSOrder/></Tablet>
        </W.DCArtboard>
        <W.DCArtboard id="pos-loading" label="POS · before the first snapshot" width={TABLET_W + TABLET_PAD} height={TABLET_H + TABLET_PAD}>
          <Tablet><W.POSOrder state="loading"/></Tablet>
        </W.DCArtboard>
        <W.DCArtboard id="pos-blank" label="POS · menu is empty" width={TABLET_W + TABLET_PAD} height={TABLET_H + TABLET_PAD}>
          <Tablet><W.POSOrder state="blank"/></Tablet>
        </W.DCArtboard>
        <W.DCArtboard id="pos-order-empty" label="POS · empty order" width={TABLET_W + TABLET_PAD} height={TABLET_H + TABLET_PAD}>
          <Tablet><W.POSOrder state="empty"/></Tablet>
        </W.DCArtboard>
        <W.DCArtboard id="pos-order-live" label="POS · item just went sold out" width={TABLET_W + TABLET_PAD} height={TABLET_H + TABLET_PAD}>
          <Tablet><W.POSOrder state="live"/></Tablet>
        </W.DCArtboard>
        <W.DCArtboard id="pos-order-price" label="POS · price just changed under the ticket" width={TABLET_W + TABLET_PAD} height={TABLET_H + TABLET_PAD}>
          <Tablet><W.POSOrder state="price"/></Tablet>
        </W.DCArtboard>
        <W.DCArtboard id="pos-order-gone" label="POS · item left the menu mid-order" width={TABLET_W + TABLET_PAD} height={TABLET_H + TABLET_PAD}>
          <Tablet><W.POSOrder state="gone"/></Tablet>
        </W.DCArtboard>
        <W.DCArtboard id="pos-order-elsewhere" label="POS · change in a category nobody is watching" width={TABLET_W + TABLET_PAD} height={TABLET_H + TABLET_PAD}>
          <Tablet><W.POSOrder state="elsewhere"/></Tablet>
        </W.DCArtboard>
        <W.DCArtboard id="pos-order-open" label="POS · ticket expanded" width={TABLET_W + TABLET_PAD} height={TABLET_H + TABLET_PAD}>
          <Tablet><W.POSOrder state="open"/></Tablet>
        </W.DCArtboard>
      </W.DCSection>

      <W.DCSection id="manager" title="Manager · phone"
        subtitle="Create, edit, delete menu items and flip them sold out. Every change lands on the POS in real time. The first artboard is the whole flow: tap a row to open the item sheet, add an item, delete one, and watch the list underneath change.">
        <W.DCArtboard id="manager-menu" label="Manager · menu list & item sheet — INTERACTIVE" width={PHONE_W + PAD} height={PHONE_H + PAD}>
          <Phone><W.ManagerMenu/></Phone>
        </W.DCArtboard>
        <W.DCArtboard id="manager-menu-empty" label="Manager · empty menu" width={PHONE_W + PAD} height={PHONE_H + PAD}>
          <Phone><W.ManagerMenu state="empty"/></Phone>
        </W.DCArtboard>
        <W.DCArtboard id="manager-edit" label="Manager · item sheet, editing" width={PHONE_W + PAD} height={PHONE_H + PAD}>
          <Phone><W.ManagerMenu state="edit"/></Phone>
        </W.DCArtboard>
        <W.DCArtboard id="manager-edit-new" label="Manager · item sheet, new item" width={PHONE_W + PAD} height={PHONE_H + PAD}>
          <Phone><W.ManagerMenu state="new"/></Phone>
        </W.DCArtboard>
        <W.DCArtboard id="manager-edit-errors" label="Manager · saved with nothing filled in" width={PHONE_W + PAD} height={PHONE_H + PAD}>
          <Phone><W.ManagerMenu state="errors"/></Phone>
        </W.DCArtboard>
        <W.DCArtboard id="manager-edit-delete" label="Manager · delete confirm" width={PHONE_W + PAD} height={PHONE_H + PAD}>
          <Phone><W.ManagerMenu state="delete"/></Phone>
        </W.DCArtboard>
      </W.DCSection>
    </W.DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
